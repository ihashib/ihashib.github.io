<header class="site-header" id="top">
  <nav class="nav wrap" aria-label="Main">
    <a href="{{ '/' | relative_url }}" class="nav-name">
      Hashibul Islam
    </a>

    <ul class="nav-links" id="nav-links">
      <li><a href="{{ '/#overview' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Overview</a></li>
      {%- for s in site.data.sections %}
      {%- include nav-active.html section=s %}
      <li><a href="{{ s.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ s.title }}</a></li>
      {%- endfor %}
      <li>
        <a href="{{ '/cv/Md-Hashibul-Islam-CV.pdf' | relative_url }}" class="nav-cv" download>
          <i class="fas fa-arrow-down" aria-hidden="true"></i> CV
        </a>
      </li>
    </ul>

    <div class="nav-tools">
      <button class="icon-btn palette-open" type="button" aria-label="Search and jump (Ctrl K)" title="Search and jump">
        <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
        <kbd class="kbd-hint" aria-hidden="true">Ctrl K</kbd>
      </button>
      <button class="icon-btn theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
        <i class="fas fa-moon" aria-hidden="true"></i>
        <i class="fas fa-sun" aria-hidden="true"></i>
      </button>
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav-links">
        <span class="sr-only">Menu</span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
    </div>
  </nav>
  <div class="read-progress" aria-hidden="true"></div>
</header>
