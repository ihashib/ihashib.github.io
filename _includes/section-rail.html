<nav class="section-rail is-shown" aria-label="Sections">
  <ol class="rail-list">
    <li class="rail-home"><a href="{{ '/#overview' | relative_url }}"><span class="rail-seg" aria-hidden="true"></span><i class="fas fa-table-cells-large" aria-hidden="true"></i><span class="rail-label">Overview</span></a></li>
    {%- for s in site.data.sections %}
    {%- include nav-active.html section=s %}
    <li><a href="{{ s.url | relative_url }}"{% if active %} aria-current="page"{% endif %}><span class="rail-seg" aria-hidden="true"></span><i class="fas {{ s.icon }}" aria-hidden="true"></i><span class="rail-label">{{ s.title }}</span></a></li>
    {%- endfor %}
  </ol>
</nav>
