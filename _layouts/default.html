<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body class="{{ page.body_class }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main id="main">
      {{ content }}
    </main>
    {% include footer.html %}
    {% include palette.html %}
    <script>window.SITE = { base: "{{ site.baseurl }}", email: "{{ site.author.email }}" };</script>
    <script src="{{ '/scripts/script.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  </body>
</html>
